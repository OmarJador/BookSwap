<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="https://kit.fontawesome.com/f9cf3c4dfe.js" crossorigin="anonymous"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body style="font-family: 'Plus Jakarta Sans', sans-serif;">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a href="index.html" class="navbar-brand"><i class="fa-solid fa-book-open"></i>BookSwap</a>
            <div class="collapse navbar-collapse" id="navbar__content">
                <div class="navbar-nav ">
                    <a href="index.html" class="nav-link active"><i class="fa-solid fa-house"></i>Demande d'échanges</a>
                    <a href="livres.html" class="nav-link"><i class="fa-solid fa-book"></i>Livres</a>
                    <a href="about.html" class="nav-link"><i class="fa-solid fa-circle-info"></i>À propos</a>
                </div>
            </div>
        </div>
    </nav>
    <main class="row">
        <aside class="col-12 col-lg-3 col-xl-2 py-1 px-2">
            <div class="bg-white border rounded-3 shadow-sm p-3">
                <h5 class="text-black">Rechercher</h>
                <input type="search" class="form-control " placeholder="Titre du livre...">
                <hr>
                <h5 class="text-black">Type d'échange</h5>
                <div class="form-check mb-3">
                    <input type="checkbox" id="all" class="form-check-input" checked>
                    <label for="all" class="form-check-label">Tous</label>
                </div>
                <div class="form-check mb-3">
                    <input type="checkbox" id="defenitif" class="form-check-input">
                    <label for="defenitif" class="form-check-label">Défenitif</label>
                </div>
                <div class="form-check mb-3">
                    <input type="checkbox" id="temporaire" class="form-check-input">
                    <label for="temporaire" class="form-check-label">Temporaire</label>
                </div>
                <hr>
                <h5 class="text-black">Catégorie</h5>
                <div class="dropdown">
                    <button class="btn btn-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown">Toutes les catégories</button>
                    <ul class="dropdown-menu">
                        <li><a href="" class="dropdown-item">Catégorie 1</a></li>
                        <li><a href="" class="dropdown-item">Catégorie 2</a></li>
                        <li><a href="" class="dropdown-item">Catégorie 3</a></li>
                    </ul>
                </div>
                <hr>
                <button class="btn btn-primary w-100"><i class="fa-solid fa-arrows-rotate"></i>Actualiser</button>
            </div>
        </aside>
        <div class="container col-12 col-lg-9">
            <div>
                <h1>Demandes d'échanges de livres</h1>
                <p class="text-secondary">Consulte les propositions d'échange de livres  entre apprenants.</p>
            </div>
        </div>

        
        

    </main>
    <script src="app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
</body>
</html>
